{% extends "master.html" %}
{% load static %}

{% block title %}
  After Glow
{% endblock %}


{% block content %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col">
                <a href="{% url 'main' %}" class="btn btn-dark my-3">Go Back</a>
                <div style="height: 90vh;">
                    {% for image in images %}
                    <img style="max-width: 100%; max-height: 100%" 
                        src="{{image.image.url}}">
                    {% endfor %}
                    <p>{{dress.description}}</p>
                </div>
            </div>        
        </div>    
    </div>
{% endblock %}
